name: Release
run-name: Release ${{ github.ref_name }}

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.1.7)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - name: install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - name: install packages
        run: pnpm install --frozen-lockfile

      - name: install rust
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: extract tag message
        id: tagmsg
        shell: pwsh
        run: |
          # 原生命令（git）输出按控制台代码页解码，Windows 下会变成 GBK 乱码；显式固定为 UTF-8
          $OutputEncoding = [System.Text.UTF8Encoding]::new($false)
          [Console]::OutputEncoding = [System.Text.UTF8Encoding]::new($false)

          $tag = "${{ inputs.tag || github.ref_name }}"
          # 版本号（去掉 v 前缀），用于匹配安装包文件名 YueEasy_<version>_x64-setup.exe
          $version = $tag -replace '^v', ''
          $msg = $(git tag -l --format='%(contents)' $tag)
          if (-not $msg) {
            $msg = "安装包见下方 Assets"
          }
          # 多行 output 一律用 `name<<DELIMITER` 语法，不要手工把换行转义成 %0A
          # （旧写法会让 tag message 的换行全部丢失，Release 正文挤成一行）
          $delimiter = "TAGMSG_$([guid]::NewGuid().ToString('N'))"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "body<<$delimiter" -Encoding utf8
          Add-Content -Path $env:GITHUB_OUTPUT -Value $msg.TrimEnd() -Encoding utf8
          Add-Content -Path $env:GITHUB_OUTPUT -Value $delimiter -Encoding utf8
          Add-Content -Path $env:GITHUB_OUTPUT -Value "version=$version" -Encoding utf8

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseName: 'YueEasy ${{ inputs.tag || github.ref_name }}'
          releaseBody: |
            ## 🎉 YueEasy ${{ inputs.tag || github.ref_name }}

            ${{ steps.tagmsg.outputs.body }}

            ### 📦 安装包下载
            - **Windows**: `YueEasy_${{ steps.tagmsg.outputs.version }}_x64-setup.exe`

            ### 🔧 安装说明
            - 下载 .exe 安装包后双击运行安装，安装完成即可使用

            ### 🔄 自动更新
            - 已安装的用户会在应用内收到更新提示
          releaseDraft: false
          prerelease: false
          updaterJsonPreferNsis: true
