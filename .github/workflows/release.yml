name: Release
run-name: Release ${{ github.ref_name }}

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.1.7)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - name: install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - name: install packages
        run: pnpm install --frozen-lockfile

      - name: install rust
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: extract tag message
        id: tagmsg
        shell: pwsh
        run: |
          $tag = "${{ inputs.tag || github.ref_name }}"
          $msg = $(git tag -l --format='%(contents)' $tag)
          if (-not $msg) {
            $msg = "安装包见下方 Assets"
          }
          # 保证末尾换行，避免与下方模板粘在一起
          $msg = $msg.TrimEnd() + "`n"
          # encode newlines so GitHub Actions expressions can pass them through
          $escaped = $msg -replace '%', '%25' -replace "`n", '%0A' -replace "`r", '%0D'
          echo "body=$escaped" >> $env:GITHUB_OUTPUT

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseName: "YueEasy ${{ inputs.tag || github.ref_name }}"
          releaseBody: |
            ## 🎉 YueEasy ${{ inputs.tag || github.ref_name }}

            ${{ steps.tagmsg.outputs.body }}

            ### 📦 安装包下载
            - **Windows**: `YueEasy_${{ inputs.tag || github.ref_name }}_x64-setup.exe`

            ### 🔧 安装说明
            - 下载 .exe 安装包后双击运行安装，安装完成即可使用

            ### 🔄 自动更新
            - 已安装的用户会在应用内收到更新提示
          releaseDraft: false
          prerelease: false
          updaterJsonPreferNsis: true
